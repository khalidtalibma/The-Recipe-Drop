# Codemagic builds the iOS app and uploads it to App Store Connect / TestFlight.
# Before the first build (one time, in Codemagic):
#   Team settings → Integrations → Developer Portal → Connect, and name the key: recipedrop_asc
workflows:
  ios-release:
    name: The Recipe Drop — iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: recipedrop_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ae.therecipedrop.app
      vars:
        BUNDLE_ID: ae.therecipedrop.app
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Create the iOS project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
      - name: App icon and splash screen
        script: npm run assets
      - name: Info.plist (Bluetooth permission, export compliance)
        script: ./scripts/ios-plist.sh
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set bundle id and signing
        script: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" ios/App/App.xcodeproj/project.pbxproj
          xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all $((BUILD_NUMBER + 100))
          agvtool new-marketing-version 1.0.0
      - name: Build the app (.ipa)
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
